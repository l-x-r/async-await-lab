<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab — 技术笔记与交互教程</title>
<meta name="description" content="中文技术知识库：交互教程与可复测的设计规则。">
<style>
:root{--bg:#f7f8f5;--ink:#202c29;--muted:#738079;--line:#dce2db;--green:#26694a;--lime:#d5edaa;--purple:#9275c1;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}
.shell{max-width:1080px;margin:auto;padding:0 32px}
header{height:84px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:750;letter-spacing:-.5px;text-decoration:none;color:inherit}
.mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-size:16px}
.brand small{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:500;margin-left:7px}
.hero{padding:64px 0 40px}
.eyebrow{font:11px var(--mono);letter-spacing:2px;color:var(--green);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
h1{font-size:44px;line-height:1.2;letter-spacing:-1.5px;margin:14px 0 16px}
h1 em{font-style:normal;color:var(--green)}
.lead{max-width:680px;color:#5d6b63;font-size:16px;margin:0}
.cat{padding:8px 0 34px}
.cat-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.cat-head h2{font-size:21px;letter-spacing:-.5px;margin:0}
.cat-head span{font:11px var(--mono);color:#879388;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.empty{color:var(--muted);font-size:14px;margin:0}
.toc{display:flex;gap:18px;font-size:13px;margin-top:20px}.toc a{color:var(--green);text-decoration:none}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 26px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--green);transform:translateY(-2px)}
.tag{display:inline-block;font:10px var(--mono);letter-spacing:1px;color:var(--green);background:var(--lime);padding:2px 9px;border-radius:99px}
.tag.v{background:#e6def4;color:#5d4590}
.card h3{font-size:20px;letter-spacing:-.4px;margin:12px 0 6px}
.card p{margin:0;color:#5d6b63;font-size:14px}
.go{display:block;margin-top:14px;font:12px var(--mono);color:var(--green)}
footer{border-top:1px solid var(--line);padding:23px 0 36px;color:#98a08e;font:10px/1.7 var(--mono)}
@media(max-width:820px){.shell{padding:0 20px}.grid{grid-template-columns:1fr}h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body><div class="shell">
<header><a class="brand" href="./"><span class="mark">↗</span> Lab <small>NOTES &amp; GUIDES</small></a></header>
<main>
<div class="hero">
  <div class="eyebrow"><span class="dot"></span> KNOWLEDGE BASE</div>
  <h1>把看不见的东西，<em>变成看得懂的。</em></h1>
  <p class="lead">中文技术知识库：交互式教程，以及附带测试脚本的设计规则。</p>
  <nav class="toc"><a href="#js">JS</a><a href="#db">数据库</a><a href="#ai">AI</a></nav>
</div>
<section class="cat" id="js">
  <div class="cat-head"><h2>JavaScript</h2><span>JS</span></div>
  <div class="grid">
  <a class="card" href="js/async-await/">
    <span class="tag">交互教程</span>
    <h3>看懂 async / await</h3>
    <p>用执行动画逐步演示 await 的暂停与恢复、微任务顺序、错误处理，以及串行与并发的差别。</p>
    <span class="go">打开 →</span>
  </a>
  </div>
</section>
<section class="cat" id="db">
  <div class="cat-head"><h2>数据库</h2><span>DB</span></div>
  <div class="grid">
  <a class="card" href="db/postgresql/">
    <span class="tag v">规则手册</span>
    <h3>PostgreSQL 18 设计规则手册</h3>
    <p>15 条表结构设计规则：键与约束、数据类型、索引、分页和在线迁移，每条附检查查询。</p>
    <span class="go">打开 →</span>
  </a>
  </div>
</section>
<section class="cat" id="ai">
  <div class="cat-head"><h2>AI</h2><span>AI</span></div>
  <p class="empty">暂无文章。</p>
</section>
</main>
<footer>↗ LAB</footer>
</div></body>
</html>
